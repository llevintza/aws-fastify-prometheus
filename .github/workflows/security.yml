name: Security Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly deeper dependency audit (CI already audits on every PR).
    - cron: '0 9 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # TruffleHog needs history to diff the commit range.
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Run Semgrep
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.110.0 \
            semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/nodejs \
            .
          status=$?
          set -e
          # Semgrep: 0 clean, 1 findings, >=2 tool/config failure.
          if [[ "$status" -gt 1 ]]; then
            echo "::error::Semgrep tool error (exit $status)"
            exit "$status"
          fi
          echo "Semgrep finished (exit $status; 1 means findings only, job stays green)"
          exit 0

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          path: ./
          version: 3.99.9
          extra_args: --only-verified

      - name: Setup Node/Yarn for weekly audit
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/setup-node-yarn

      - name: Weekly dependency audit artifact
        if: always() && github.event_name == 'schedule'
        env:
          YARN_ENABLE_COLORS: '0'
        run: |
          set +e
          yarn npm audit -A -R > audit-report.txt 2>&1
          set -e
          {
            echo "## Weekly dependency audit"
            echo ""
            echo '```'
            head -n 120 audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload weekly audit report
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: audit-report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Write summary and upsert PR pointer
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          REPORT_TOKEN: ${{ secrets.CODE_QUALITY_REPORT_TOKEN }}
        with:
          # Placeholder when secret absent (forks); script returns before Octokit use.
          github-token: ${{ secrets.CODE_QUALITY_REPORT_TOKEN || 'unused' }}
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = [
              '## Security Analysis',
              '',
              '- CodeQL: see the repository **Security → Code scanning** tab',
              '- Semgrep: pinned `semgrep/semgrep:1.110.0`; tool errors fail, findings do not',
              '- TruffleHog: verified secrets only (job fails on findings)',
              '- Dependency audit on PRs: owned by **CI/CD → Security Audit**',
              '',
              `[Open workflow run](${runUrl})`,
            ].join('\n');
            await core.summary.addRaw(summary, true).write();

            if (!process.env.REPORT_TOKEN) {
              core.warning('CODE_QUALITY_REPORT_TOKEN unavailable; skipping PR comment upsert');
              return;
            }

            const marker = '<!-- ci-report:security -->';
            const body = [
              marker,
              '### Security Analysis',
              `- Details: [workflow run](${runUrl}) (Summary + logs)`,
              '- Code scanning alerts: repository **Security** tab (CodeQL)',
              '- Dependency audit: see **CI/CD** check / `ci-audit-report` artifact',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
