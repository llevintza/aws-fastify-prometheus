# Dependabot Stack / Restack
#
# Retargets and rebases open Dependabot PRs into a fixed merge order so they
# can be merged bottom-up. Runs when Dependabot opens/updates a PR, after a
# Dependabot PR is closed (including merge → restack remaining), or manually.
#
# Required secret: GH_TOKEN
#   Classic PAT (never fine-grained, never GITHUB_TOKEN — see AGENTS.md) with
#   the `repo` scope (`public_repo` is enough for a public repo) that can
#   force-push dependabot/* branches. No `read:org`: the script uses REST
#   (`gh api`) for bases, labels and comments, never `gh pr edit`.
#   Plain GITHUB_TOKEN cannot push to dependabot/* branches in most repos.
# Fallback (if GH_TOKEN is unset in this environment): XOON_NPM_PUBLISH_TOKEN
#   when that token also has the scopes above — prefer a dedicated GH_TOKEN.
#
# Does not rewrite Dependabot commit messages/contents; only rebases,
# retargets PR bases, and links the chain into a native GitHub stack through
# the Stacks REST API (unstack first when a stacked PR must change base, which
# GitHub otherwise rejects with HTTP 422). Chained bases alone do not form a
# stack. No gh extension is needed.
#
# yarn.lock: rebasing npm branches merges yarn.lock as text and can leave a
# non-canonical lockfile that fails `yarn install --immutable` in CI. The
# script normalizes it with Yarn on each rebased npm branch and amends the
# Dependabot commit; see its header for the pull_request_target safety rules.
#
# Concurrency is set on the JOB, not the workflow. pull_request_target fires
# for every PR, and the job `if` skips non-Dependabot PRs. With a
# workflow-level group, that skipped run still entered the group and replaced
# (cancelled) a pending Dependabot run or manual dispatch. A skipped job never
# enters a job-level group. Inside the group GitHub keeps one running and one
# pending run, so a newer pending run can still replace an older one; that is
# safe because every run re-reads all open PRs and stacks from scratch.
# Dry-run dispatches use their own group: they mutate nothing, so they never
# queue behind, or replace, a live restack.
# Safety rules (hold check, retarget-before-push ordering, rollback) are in
# the header of .github/scripts/stack-dependabot-prs.sh. PRs with commits not
# authored by dependabot[bot] are held out of the stack and never rewritten.
# dry_run clones and plans the rebases, prints every decision (including the
# held PRs), and mutates nothing on GitHub.

name: Dependabot Stack

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print planned stack actions without mutating'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  pull-requests: write

jobs:
  stack-dependabot-prs:
    name: Stack Dependabot PRs
    runs-on: ubuntu-latest
    # Dependabot author on PR events; always run for manual dispatch.
    # The webhook payload and the REST API the stack script lists PRs with
    # both use the login `dependabot[bot]`.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == 'dependabot[bot]')
    concurrency:
      group: >-
        dependabot-stack-${{ github.repository }}-${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        && 'dry-run' || 'live' }}
      cancel-in-progress: false

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v7
        with:
          # pull_request_target checks out the base ref by default (trusted).
          # Script lives on the default branch / this workflow's ref.
          path: .stack-src
          # No token left in .stack-src/.git/config for later steps to read.
          persist-credentials: false

      # Node and Yarn for yarn.lock normalization on npm branches. Same order
      # as .github/actions/setup-node-yarn, but no dependency cache and no
      # install: on pull_request_target a cache filled from PR content could
      # be poisoned. The Node version comes from the trusted checkout; the
      # script pins Yarn to the trunk's packageManager and runs it with
      # scripts disabled and no secrets in its environment.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .stack-src/.nvmrc

      - name: Stack / restack Dependabot PRs
        env:
          # Prefer GH_TOKEN; fall back to XOON_NPM_PUBLISH_TOKEN when it is a
          # classic PAT with repo (public_repo) scope that can push to dependabot/*.
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.XOON_NPM_PUBLISH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: main
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: Neither secrets.GH_TOKEN nor secrets.XOON_NPM_PUBLISH_TOKEN is set." >&2
            echo "Need a classic PAT with repo (public_repo) scope that can push to dependabot/*." >&2
            exit 1
          fi
          chmod +x .stack-src/.github/scripts/stack-dependabot-prs.sh
          .stack-src/.github/scripts/stack-dependabot-prs.sh
