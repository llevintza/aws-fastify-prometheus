name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: read
  checks: write
  statuses: write

jobs:
  # Job name "Setup" is required by the main-branch-protection ruleset.
  # Real Node/Yarn install lives in ./.github/actions/setup-node-yarn per job.
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - run: echo "Setup check retained for ruleset; install is per-job via composite action."

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-yarn
      - name: Run TypeScript type checking
        run: yarn type-check

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-yarn
      - name: Run ESLint
        run: yarn lint
      - name: Check code formatting
        run: yarn format:check
      - name: Check for circular dependencies
        # madge is a locked devDependency (avoid unlocked npx).
        run: yarn madge --circular --extensions ts src/

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-yarn
      - name: Run yarn audit
        id: audit
        env:
          YARN_ENABLE_COLORS: '0'
        run: |
          set +e
          yarn npm audit -A -R > audit-report.txt 2>&1
          status=$?
          set -e
          cat audit-report.txt
          {
            echo "## Dependency audit"
            echo ""
            echo "Exit code: \`$status\` (non-zero means findings or tool errors; job stays green so Dependabot can land patches)."
            echo ""
            echo '```'
            head -n 80 audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Soft gate: report findings without failing CI (same policy as before).
          exit 0
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-audit-report
          path: audit-report.txt
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-yarn
      - name: Clean previous build
        run: yarn clean
      - name: Build project
        run: yarn build
      - name: Verify build outputs
        run: |
          test -d dist
          test -f dist/index.js
          test -f dist/index.d.ts
          size=$(wc -c < dist/index.js | tr -d ' ')
          size_kb=$((size / 1024))
          echo "dist/index.js size: ${size_kb} KB"
          echo "## Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`dist/index.js\`: **${size_kb} KB** (${size} bytes)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage summary not found"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const coverage = require('./coverage/coverage-summary.json');
          const total = coverage.total;
          const thresholds = { branches: 40, functions: 24, lines: 45, statements: 45 };
          let failed = false;
          const lines = [
            '## Coverage',
            '',
            '| Metric | Actual | Threshold | Status |',
            '| --- | ---: | ---: | --- |',
          ];
          for (const [key, threshold] of Object.entries(thresholds)) {
            const actual = total[key].pct;
            const ok = actual >= threshold;
            console.log(`${key}: ${actual}% (threshold: ${threshold}%)`);
            lines.push(`| ${key} | ${actual}% | ${threshold}% | ${ok ? 'ok' : 'FAIL'} |`);
            if (!ok) failed = true;
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (failed) process.exit(1);
          NODE
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
          retention-days: 7
      - name: Upload coverage to Codecov
        if: matrix.node-version == 26
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-yarn
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: dist/
      - name: Validate package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const required = ['name', 'version', 'description', 'main', 'types', 'author', 'license'];
            const missing = required.filter(field => !pkg[field]);
            if (missing.length) {
              console.error('Missing required fields:', missing);
              process.exit(1);
            }
            console.log('package.json ok');
          "
      - name: Test package import
        run: |
          node -e "
            const pkg = require('./dist/index.js');
            console.log('exports:', Object.keys(pkg));
          "
      - name: Check package size
        run: |
          size=$(npm pack --dry-run --json | jq -r '.[0].size // .size // 0' 2>/dev/null || echo 0)
          echo "Package size: $size bytes"
          echo "## Package pack size" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry-run pack size: **${size}** bytes" >> "$GITHUB_STEP_SUMMARY"

  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs:
      [
        type-check,
        lint-and-format,
        security-audit,
        build,
        test,
        package-validation,
      ]
    steps:
      - name: Download coverage summary
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results-node-26
          path: coverage/
      - name: Write job summary and upsert PR pointer
        uses: actions/github-script@v9
        env:
          TYPE_CHECK: ${{ needs.type-check.result }}
          LINT: ${{ needs.lint-and-format.result }}
          AUDIT: ${{ needs.security-audit.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package-validation.result }}
          REPORT_TOKEN: ${{ secrets.CODE_QUALITY_REPORT_TOKEN }}
        with:
          # Placeholder when secret absent (forks); script returns before Octokit use.
          github-token: ${{ secrets.CODE_QUALITY_REPORT_TOKEN || 'unused' }}
          script: |
            const fs = require('fs');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobs = [
              ['Type Check', process.env.TYPE_CHECK],
              ['Lint & Format', process.env.LINT],
              ['Security Audit', process.env.AUDIT],
              ['Build', process.env.BUILD],
              ['Tests', process.env.TEST],
              ['Package Validation', process.env.PACKAGE],
            ];
            const failed = jobs.filter(([, s]) => s !== 'success').map(([n]) => n);
            const overall = failed.length ? 'failed' : 'passed';

            let coverageLine = 'Coverage summary not available for this run.';
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const total = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
              coverageLine = `Lines ${total.lines.pct}% · Functions ${total.functions.pct}% · Branches ${total.branches.pct}% · Statements ${total.statements.pct}%`;
            }

            const summary = [
              `## CI/CD ${overall}`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...jobs.map(([n, s]) => `| ${n} | ${s} |`),
              '',
              `Coverage (Node 26): ${coverageLine}`,
              '',
              `Artifacts on this run: \`build-artifacts\`, \`test-results-node-*\`, \`ci-audit-report\`.`,
              '',
              `[Open workflow run](${runUrl})`,
            ].join('\n');
            await core.summary.addRaw(summary, true).write();

            if (!process.env.REPORT_TOKEN) {
              core.warning('CODE_QUALITY_REPORT_TOKEN unavailable; skipping PR comment upsert');
              return;
            }

            const marker = '<!-- ci-report:ci -->';
            const body = [
              marker,
              '### CI/CD',
              `- Status: **${overall}**${failed.length ? ` (failed: ${failed.join(', ')})` : ''}`,
              `- Coverage: ${coverageLine}`,
              `- Details: [workflow run](${runUrl}) (Summary + Artifacts)`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  docs-sync-dependabot:
    name: Dependabot Docs Sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Foreign-commit gate copies match
        # The stack script and auto-merge each hold PRs with non-Dependabot
        # commits using the same jq rule. Fail if the two copies drift.
        run: |
          set -euo pipefail
          extract() {
            awk '/# foreign-commit-gate:end/ { f = 0 } f { print } /# foreign-commit-gate:begin/ { f = 1 }' "$1" \
              | sed 's/^[[:space:]]*//'
          }
          a=$(extract .github/workflows/dependabot-auto-merge.yml)
          b=$(extract .github/scripts/stack-dependabot-prs.sh)
          if [[ -z "$a" || "$a" != "$b" ]]; then
            echo "::error::foreign-commit gate differs between dependabot-auto-merge.yml and stack-dependabot-prs.sh (or markers are missing)"
            diff <(printf '%s\n' "$a") <(printf '%s\n' "$b") || true
            exit 1
          fi
          echo "Foreign-commit gate copies match:"
          printf '%s\n' "$a"
      - name: Require hub update when Dependabot automation changes
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          out=$(git diff --no-renames --name-only "$BASE...$HEAD")
          mapfile -t changed <<< "$out"

          automation=(
            .github/dependabot.yml
            .github/workflows/dependabot-stack.yml
            .github/workflows/dependabot-auto-merge.yml
            .github/scripts/stack-dependabot-prs.sh
            scripts/semantic-release-analyze-commits.js
          )
          hubs=(
            .github/WORKFLOWS_SUMMARY.md
            docs/RELEASE_GUIDE.md
          )

          auto_hit=()
          for path in "${automation[@]}"; do
            for c in "${changed[@]}"; do
              if [[ "$c" == "$path" ]]; then
                auto_hit+=("$path")
                break
              fi
            done
          done

          if [[ ${#auto_hit[@]} -eq 0 ]]; then
            echo "No Dependabot automation paths changed; docs sync gate is a no-op."
            exit 0
          fi

          hub_hit=()
          for path in "${hubs[@]}"; do
            for c in "${changed[@]}"; do
              if [[ "$c" == "$path" ]]; then
                hub_hit+=("$path")
                break
              fi
            done
          done

          {
            echo "## Dependabot docs sync"
            echo ""
            echo "Automation changed:"
            printf -- '- `%s`\n' "${auto_hit[@]}"
            echo ""
            if [[ ${#hub_hit[@]} -gt 0 ]]; then
              echo "Hub(s) updated:"
              printf -- '- `%s`\n' "${hub_hit[@]}"
            else
              echo "Hub(s) updated: *(none)*"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#hub_hit[@]} -eq 0 ]]; then
            echo "::error::Dependabot automation changed without updating a docs hub."
            echo "Changed automation: ${auto_hit[*]}"
            echo "Update at least one of:"
            printf -- '  - %s\n' "${hubs[@]}"
            echo "Behavior SSOT is the automation files; hubs stay thin (see AGENTS.md)."
            exit 1
          fi

          echo "Docs hubs updated alongside automation: ${hub_hit[*]}"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      [
        type-check,
        lint-and-format,
        security-audit,
        build,
        test,
        package-validation,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.XOON_NPM_PUBLISH_TOKEN }}
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: '@llevintza'
      - run: yarn install --immutable
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: dist/
      - name: Release
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.XOON_NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.XOON_NPM_PUBLISH_TOKEN }}
          HUSKY: 0

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        setup,
        type-check,
        lint-and-format,
        security-audit,
        build,
        test,
        package-validation,
        docs-sync-dependabot,
      ]
    if: always()
    steps:
      - name: Check overall status
        run: |
          # docs-sync-dependabot is PR-only; skipped on push is OK.
          jobs=(
            "setup:${{ needs.setup.result }}"
            "type-check:${{ needs.type-check.result }}"
            "lint-and-format:${{ needs.lint-and-format.result }}"
            "security-audit:${{ needs.security-audit.result }}"
            "build:${{ needs.build.result }}"
            "test:${{ needs.test.result }}"
            "package-validation:${{ needs.package-validation.result }}"
            "docs-sync-dependabot:${{ needs.docs-sync-dependabot.result }}:allow_skip"
          )
          failed=()
          for job in "${jobs[@]}"; do
            name="${job%%:*}"
            rest="${job#*:}"
            status="${rest%%:*}"
            allow_skip=0
            if [[ "$rest" == *":allow_skip" ]]; then
              allow_skip=1
            fi
            if [[ "$status" == "success" ]]; then
              continue
            fi
            if [[ "$allow_skip" -eq 1 && "$status" == "skipped" ]]; then
              continue
            fi
            failed+=("$name")
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "CI failed: ${failed[*]}"
            exit 1
          fi
          echo "All CI checks passed"
