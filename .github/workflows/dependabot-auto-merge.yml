name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto-Merge
    runs-on: ubuntu-latest
    # Use PR author (not event actor) so reopen/label/human sync still runs for Dependabot PRs
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Get Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI Success
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: CI Success
          running-workflow-name: Dependabot Auto-Merge
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          # CI Success is a late aggregator job; default 60s discovery timeout
          # exits before that check even exists on the ref.
          checks-discovery-timeout: 1800
          allowed-conclusions: success

      - name: Assess dependency risk
        id: risk
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: |
          set -euo pipefail

          echo "Dependencies: $DEPENDENCY_NAMES"
          echo "Update type: $UPDATE_TYPE"
          echo "Dependency group: $DEPENDENCY_GROUP"

          risk_level="low"

          # Group-specific high risk (security-critical and major ecosystem groups)
          if echo "$DEPENDENCY_GROUP $DEPENDENCY_NAMES" | grep -Eiq 'security-critical|fastify-ecosystem-major|aws-ecosystem'; then
            risk_level="high"
            echo "High-risk dependency group detected"
          fi

          # High-risk Fastify major updates
          if echo "$DEPENDENCY_NAMES" | grep -Eiq 'fastify|@fastify/|fastify-plugin' && [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            risk_level="high"
            echo "High-risk Fastify major update detected"
          fi

          # High-risk monitoring / AWS major updates
          if echo "$DEPENDENCY_NAMES" | grep -Eiq 'prom-client|prometheus-|aws-sdk|@aws-sdk/' && [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            risk_level="high"
            echo "High-risk monitoring/AWS major update detected"
          fi

          # Any remaining major update is at least medium risk
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ] && [ "$risk_level" = "low" ]; then
            risk_level="medium"
            echo "Major version update - elevated risk"
          fi

          echo "risk_level=$risk_level" >> "$GITHUB_OUTPUT"

      - name: Request manual review for risky updates
        if: steps.risk.outputs.risk_level == 'high' || steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          RISK_LEVEL: ${{ steps.risk.outputs.risk_level }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          comment_message="🔍 **Manual Review Required**

          This dependency update requires human review.

          **Updated Dependencies:**
          ${DEPENDENCY_NAMES}

          **Update Type:** ${UPDATE_TYPE}
          **Risk Level:** ${RISK_LEVEL}

          **Recommended Actions:**
          1. Review the changelog for breaking changes
          2. Check security advisories for the affected dependencies
          3. Run integration tests locally
          4. Verify compatibility with your codebase

          @${REPO_OWNER} please review this PR manually."

          gh pr comment "$PR_NUMBER" --body "$comment_message"

      # Stack gate: only the bottom stacked PR (base == main) may auto-approve / auto-merge.
      # Upper stacked Dependabot PRs still wait for CI and can comment on high risk above,
      # but must not merge until stacking retargets them onto main.
      - name: Auto-approve safe updates
        if: |
          github.event.pull_request.base.ref == 'main' &&
          steps.risk.outputs.risk_level != 'high' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          RISK_LEVEL: ${{ steps.risk.outputs.risk_level }}
        run: |
          set -euo pipefail

          if [ "$RISK_LEVEL" = "low" ]; then
            approval_text="**Low Risk - Safe to Auto-Approve**"
          else
            approval_text="**Medium Risk - Approved with Monitoring**"
          fi

          approval_message="🤖 **Automated Approval**

          This dependency update has been automatically approved:

          - **CI/CD Status**: CI Success passed
          - **Risk Assessment**: ${approval_text}
          - **Update Type**: ${UPDATE_TYPE}
          - **Dependencies**: ${DEPENDENCY_NAMES}

          This PR is safe to merge."

          # Soft-fail if already approved / reviewed by this token
          if ! gh pr review "$PR_NUMBER" --approve --body "$approval_message"; then
            echo "Approve step returned non-zero (may already be approved); continuing."
          fi

      # Confident-row auto-merge only (base == main + patch + low risk + denylist).
      # Do NOT pass --subject with feat(deps)/fix(deps): leave the default
      # "Merge pull request #N" so analyzeCommits can read Dependabot trailers.
      # Keep --body short; NEVER paste the full Dependabot PR body (upstream
      # BREAKING CHANGE lines can false-major the release).
      #
      # Human raises on held PRs should encode the release intentionally, e.g.:
      #   gh pr merge --merge --subject 'feat(deps)!: …' --body $'BREAKING CHANGE: …'
      # (or fix/feat) with a short BREAKING CHANGE body written by a human,
      # not Dependabot's description.
      - name: Auto-merge safe patch updates
        if: |
          github.event.pull_request.base.ref == 'main' &&
          steps.risk.outputs.risk_level == 'low' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          !contains(steps.metadata.outputs.dependency-names, 'fastify') &&
          !contains(steps.metadata.outputs.dependency-names, '@aws-sdk') &&
          !contains(steps.metadata.outputs.dependency-names, '@prometheus-io/client') &&
          !contains(steps.metadata.outputs.dependency-group, 'security-critical') &&
          !contains(steps.metadata.outputs.dependency-group, 'fastify-ecosystem-major') &&
          !contains(steps.metadata.outputs.dependency-group, 'aws-ecosystem')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Best-effort refuse when title/body/group suggest engines or Fastify peer contract changes
          if echo "$DEPENDENCY_GROUP $PR_TITLE $PR_BODY" | grep -Eiq \
            'fastify-ecosystem-major|engines?\.node|peerDependenc|peer.?contract|requires? fastify|engine.?requirement'; then
            echo "Refusing auto-merge: engines / Fastify peer contract signals in metadata"
            exit 0
          fi

          # Refuse @prometheus-io/client always; refuse prom-client when major / misclassified major
          if echo "$DEPENDENCY_NAMES $DEPENDENCY_GROUP $PR_TITLE" | grep -Eiq '@prometheus-io/client'; then
            echo "Refusing auto-merge: @prometheus-io/client"
            exit 0
          fi
          if echo "$DEPENDENCY_NAMES $DEPENDENCY_GROUP $PR_TITLE" | grep -Eiq 'prom-client' && \
             { [ "$UPDATE_TYPE" = "version-update:semver-major" ] || echo "$DEPENDENCY_GROUP $PR_TITLE $PR_BODY" | grep -Eiq 'major|breaking'; }; then
            echo "Refusing auto-merge: prom-client major / breaking signals"
            exit 0
          fi

          echo "Auto-merging confident-row patch update for: $DEPENDENCY_NAMES"
          # Repo disallows squash merges; use merge + auto.
          # No --subject: default merge subject preserves Dependabot trailers for analyzeCommits.
          gh pr merge "$PR_NUMBER" --merge --auto --body "🤖 Auto-merged safe patch update"
