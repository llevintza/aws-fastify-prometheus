name: Dependabot Auto-Merge

# Run after the CI/CD workflow finishes successfully. workflow_run uses the
# default branch context (secrets + write token) without pull_request_target,
# which GitHub is browning out / blocking on public repos.
on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto-Merge
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Approve and enable auto-merge for confident stack-bottom PRs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_BRANCH" != dependabot/* ]]; then
            echo "Not a Dependabot branch ($HEAD_BRANCH); skipping."
            exit 0
          fi

          pr_json=$(gh pr list --head "$HEAD_BRANCH" --state open \
            --json number,author,mergeable,baseRefName,headRefOid,title,body,url --jq '.[0] // empty')
          if [ -z "$pr_json" ]; then
            echo "No open PR for branch $HEAD_BRANCH; skipping."
            exit 0
          fi

          pr_number=$(echo "$pr_json" | jq -r '.number')
          author=$(echo "$pr_json" | jq -r '.author.login')
          mergeable=$(echo "$pr_json" | jq -r '.mergeable')
          base_ref=$(echo "$pr_json" | jq -r '.baseRefName')
          pr_head_sha=$(echo "$pr_json" | jq -r '.headRefOid')
          pr_title=$(echo "$pr_json" | jq -r '.title // ""')
          pr_body=$(echo "$pr_json" | jq -r '.body // ""')

          # gh may report Dependabot as dependabot, dependabot[bot], or app/dependabot
          case "$author" in
            dependabot|dependabot\[bot\]|app/dependabot) ;;
            *)
              echo "PR #$pr_number author is '$author', not Dependabot; skipping."
              exit 0
              ;;
          esac

          echo "CI/CD succeeded for Dependabot PR #$pr_number ($HEAD_BRANCH @ $HEAD_SHA)"
          echo "Base: $base_ref  Mergeable: $mergeable"

          # The verdict below is for the SHA whose CI just turned green. If the
          # branch moved since, that newer commit gets its own CI + run.
          if [ "$pr_head_sha" != "$HEAD_SHA" ]; then
            echo "PR #$pr_number head is $pr_head_sha, not the CI SHA $HEAD_SHA; skipping."
            exit 0
          fi

          # Stack gate: only the bottom stacked PR (base == main) may auto-merge.
          # Upper stacked PRs wait until restack retargets them onto main.
          if [ "$base_ref" != "main" ]; then
            echo "PR #$pr_number base is '$base_ref' (not main); skipping auto-merge for stacked upper PR."
            exit 0
          fi

          # Update type comes from the `updated-dependencies:` YAML block that
          # Dependabot writes into the COMMIT MESSAGE only (the PR body never
          # carries it). dependabot/fetch-metadata is not used: it reads the
          # pull_request event payload, which workflow_run does not have.
          # Read every commit on the PR (a stack-bottom PR based on main holds
          # only its own commits) and keep the HIGHEST type, so a grouped PR
          # with any major row is major, else any minor row is minor.
          commits_json=$(gh api "repos/${GH_REPO}/pulls/${pr_number}/commits?per_page=100")
          commit_messages=$(printf '%s\n' "$commits_json" | jq -r '.[].commit.message')

          # Safety: a Dependabot PR that a human or another bot pushed to is
          # not judged by Dependabot's metadata alone. Author must be
          # dependabot[bot]; committer must be web-flow (Dependabot's signed
          # commits) or github-actions[bot] (stack-script restacks). A GitHub
          # "Update branch" merge commit also counts as foreign and blocks.
          foreign_commits=$(printf '%s\n' "$commits_json" | jq -r '
            [.[] | select(
              ((.author.login // "") != "dependabot[bot]")
              or ((.committer.login // "")
                  | IN("web-flow", "github-actions[bot]", "dependabot[bot]") | not)
            )] | length')
          if [ "$foreign_commits" != "0" ]; then
            echo "PR #$pr_number has $foreign_commits non-Dependabot commit(s); skipping auto-merge."
            exit 0
          fi

          update_types=$(printf '%s\n' "$commit_messages" \
            | sed -nE 's/^[[:space:]]*update-type:[[:space:]]*(version-update:semver-(major|minor|patch))[[:space:]]*$/\1/p')
          update_type="unknown"
          for level in major minor patch; do
            if grep -qx "version-update:semver-${level}" <<<"$update_types"; then
              update_type="version-update:semver-${level}"
              break
            fi
          done
          echo "Detected update_type=$update_type (rows: $(echo "$update_types" | grep -c . || true))"

          signals="$HEAD_BRANCH $pr_title $pr_body $commit_messages"

          # High-risk / held rows: comment for manual review, do not auto-merge.
          needs_manual=0
          if grep -Eiq 'security-critical|fastify-ecosystem-major|aws-ecosystem|@prometheus-io/client' <<<"$signals"; then
            needs_manual=1
          fi
          if grep -Eiq 'prom-client' <<<"$signals" && \
             { [ "$update_type" = "version-update:semver-major" ] || grep -Eiq 'major|breaking' <<<"$signals"; }; then
            needs_manual=1
          fi
          if grep -Eiq 'engines?\.node|peerDependenc|peer.?contract|requires? fastify|engine.?requirement' <<<"$signals"; then
            needs_manual=1
          fi
          if [ "$update_type" = "version-update:semver-major" ]; then
            needs_manual=1
          fi

          if [ "$needs_manual" -eq 1 ]; then
            comment_message="🔍 **Manual Review Required**

          This Dependabot update is on \`main\` with green CI, but is not a confident auto-merge row
          (major / held contract risk / denylisted group).

          **Branch:** \`${HEAD_BRANCH}\`
          **Update type (highest in commit metadata):** ${update_type}

          **Recommended Actions:**
          1. Review changelogs and contract impact (peer range, engines, scrape/API)
          2. Merge with an intentional subject if needed, e.g.
             \`gh pr merge --merge --subject 'feat(deps)!: …' --body \$'BREAKING CHANGE: …'\`
             (short human body only — never paste the full Dependabot description)
          3. Leave the default merge subject for confident patches so release analysis can read trailers

          @${REPO_OWNER} please review this PR manually."

            gh pr comment "$pr_number" --body "$comment_message"
            echo "Manual review requested for PR #$pr_number; not enabling auto-merge."
            exit 0
          fi

          # Confident-row: patch only.
          if [ "$update_type" != "version-update:semver-patch" ]; then
            echo "Update type '$update_type' is not a confident patch; skipping auto-merge."
            exit 0
          fi

          # Extra denylist for production / ecosystem names even on patch metadata.
          if grep -Eiq '@aws-sdk/|aws-sdk|@prometheus-io/client|security-critical|fastify-ecosystem' <<<"$signals"; then
            echo "Denylisted dependency signals present; skipping auto-merge."
            exit 0
          fi
          if grep -Eiq '(^|[^/-])fastify([^/-]|$)|@fastify/' <<<"$signals" && \
             ! grep -Eiq 'fastify-plugin' <<<"$signals"; then
            echo "Denylisted fastify host signals present; skipping auto-merge."
            exit 0
          fi

          approval_message="🤖 **Automated Approval**

          CI/CD is green and this Dependabot PR is a confident stack-bottom patch.

          - **Branch**: \`${HEAD_BRANCH}\`
          - **SHA**: \`${HEAD_SHA}\`
          - **Base**: \`main\`
          - **Update type**: \`${update_type}\`

          Enabling auto-merge. Merge subject stays the default so Dependabot trailers
          remain available to semantic-release analyzeCommits."

          if ! gh pr review "$pr_number" --approve --body "$approval_message"; then
            echo "Approve returned non-zero (may already be approved); continuing."
          fi

          # Repo disallows squash; use merge commit. No --subject (preserve Dependabot trailers).
          # --match-head-commit: a push after this point cannot ride this auto-merge.
          # Keep --body short; never paste the full Dependabot PR body.
          if ! gh pr merge "$pr_number" --merge --auto --match-head-commit "$HEAD_SHA" --body "🤖 Auto-merged confident Dependabot patch after CI Success"; then
            echo "Auto-merge enable returned non-zero; checking PR state..."
            gh pr view "$pr_number" --json state,mergeable,mergeStateStatus,autoMergeRequest
            exit 1
          fi

          echo "Auto-merge enabled for PR #$pr_number"
