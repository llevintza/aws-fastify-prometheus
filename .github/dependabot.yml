version: 2
updates:
  # Primary npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      # Standard cron ORs day-of-month and day-of-week when both are set, so
      # this runs on days 1-7 of every month AND on every Monday, at 09:00
      # America/New_York. It is NOT "first Monday of the month".
      cronjob: "0 9 1-7 * 1"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    assignees:
      - "llevintza"
    # `include: "scope"` appends the scope itself: prefix "chore" gives
    # `chore(deps): ...` (production) and `chore(deps-dev): ...` (development).
    # Never put a scope in the prefix (it produced `chore(deps)(deps): ...`).
    # Every commit lands on main (merge commits), so this must stay a valid
    # Conventional Commit for commitlint and semantic-release.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Labels must exist in the repo or Dependabot silently drops them.
    # Workflows only rely on `stacked` (created by the stack script).
    labels:
      - "dependencies"
    versioning-strategy: "auto"
    rebase-strategy: "disabled"
    
    # Strategic dependency groupings optimized for your project
    groups:
      # Fastify ecosystem - ALL major versions together (as requested)
      fastify-ecosystem-major:
        patterns:
          - "fastify"
          - "@fastify/swagger"
          - "@fastify/cors" 
          - "@fastify/swagger-ui"
          - "fastify-plugin"
          - "@fastify/*"
        update-types:
          - "major"
      
      # Fastify ecosystem - minor and patch updates
      fastify-ecosystem:
        patterns:
          - "fastify"
          - "@fastify/swagger"
          - "@fastify/cors"
          - "@fastify/swagger-ui" 
          - "fastify-plugin"
          - "@fastify/*"
        update-types:
          - "minor"
          - "patch"
      
      # AWS SDK ecosystem - grouped together
      aws-ecosystem:
        patterns:
          - "@aws-sdk/*"
          - "aws-sdk"
          - "aws-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # Node.js runtime and types
      node-ecosystem:
        patterns:
          - "@types/node"
          - "node"
          - "ts-node"
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # Linting and formatting tools (comprehensive group)
      linting-formatting:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "prettier"
          - "@prettier/*"
          - "lint-staged"
          - "husky"
          - "@commitlint/*"
          - "commitlint"
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # TypeScript ecosystem
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "ts-*"
          - "@types/*"
        exclude-patterns:
          - "@types/node"  # This goes to node-ecosystem
          - "@types/jest"  # This goes to jest-testing
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # Jest testing framework
      jest-testing:
        patterns:
          - "jest"
          - "@jest/*"
          - "jest-*"
          - "@types/jest"
          - "ts-jest"
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # Build and utility tools
      build-utilities:
        patterns:
          - "rimraf"
          - "semantic-release"
          - "@semantic-release/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # Monitoring and metrics (production dependencies)
      monitoring-tools:
        patterns:
          - "prom-client"
          - "prometheus-*"
          - "*-metrics"
        update-types:
          - "minor"
          - "patch"
        # Major versions for monitoring tools need careful review
      
      # Security-critical production dependencies (separate for careful review)
      security-critical:
        dependency-type: "production"
        exclude-patterns:
          - "fastify*"
          - "@fastify/*"
          - "@aws-sdk/*"
          - "prom-client"
        update-types:
          - "major"

      # Catch-all for remaining direct packages
      other-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "fastify"
          - "@fastify/*"
          - "fastify-plugin"
          - "fastify*"
          - "@aws-sdk/*"
          - "aws-sdk"
          - "aws-*"
          - "@types/node"
          - "node"
          - "ts-node"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "prettier"
          - "@prettier/*"
          - "lint-staged"
          - "husky"
          - "@commitlint/*"
          - "commitlint"
          - "typescript"
          - "@typescript-eslint/*"
          - "ts-*"
          - "@types/*"
          - "jest"
          - "@jest/*"
          - "jest-*"
          - "@types/jest"
          - "ts-jest"
          - "rimraf"
          - "semantic-release"
          - "@semantic-release/*"
          - "prom-client"
          - "prometheus-*"
          - "*-metrics"
        update-types:
          - "major"
          - "minor"
          - "patch"

      # SECURITY updates. Groups without `applies-to` only cover version
      # updates, so security PRs need their own groups (needs Dependabot
      # alerts + security updates enabled in repo settings). Split by
      # update-type because dependabot-auto-merge.yml scores a grouped PR by
      # its HIGHEST row: one major in a catch-all would hold every patch.
      # No production/development split: transitive rows report a plain
      # `indirect` dependency-type, and the release analyzer already scores
      # each row on its own. Names must not contain `security-critical` or
      # `security-actions` (auto-merge denylist / stack-script substring
      # matching); the stack script ranks these in GROUP_ORDER.
      security-patch-minor:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
    
    # Security and stability rules
    # Note: Dependabot automatically excludes pre-release versions by default
    # unless specifically configured to include them
    
    ignore:
      # Preset v10 needs conventional-changelog-writer@9; semantic-release 25
      # (release-notes-generator 14 / commit-analyzer 13) still ships writer@8.
      # Lift this once semantic-release moves to writer@9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    
    # Special handling for critical packages (let automation handle these carefully)
    # Major version updates for core framework will be grouped but reviewed carefully
    
    # Version updates for DIRECT dependencies only. `indirect` was removed: it
    # made Dependabot open one ungrouped PR per transitive package (groups do
    # not absorb standalone indirect bumps). Transitives still move in the
    # lockfile when a direct dependency bumps. `allow` only filters VERSION
    # updates; security updates for vulnerable transitives are unaffected.
    allow:
      - dependency-type: "direct"
    
    # Better PR branch naming
    pull-request-branch-name:
      separator: "/"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      # Same OR semantics as above: days 1-7 of every month AND every Monday.
      cronjob: "0 9 1-7 * 1"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    assignees:
      - "llevintza"
    # Gives `ci(deps): ...` — `ci` never releases (.releaserc.js) and stays
    # hidden in the changelog; the contract analyzer scores Actions as none.
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    rebase-strategy: "disabled"
    
    groups:
      # Official GitHub Actions
      github-actions-official:
        patterns:
          - "actions/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # Third-party security and analysis actions
      security-actions:
        patterns:
          - "github/codeql-action/*"
          - "returntocorp/semgrep-action"
          - "trufflesecurity/trufflehog"
        update-types:
          - "major"
          - "minor"
          - "patch"
      
      # Dependency and automation actions
      dependency-actions:
        patterns:
          - "dependabot/*"
          - "lewagon/wait-on-check-action"
        update-types:
          - "major"
          - "minor"
          - "patch"

      # SECURITY updates for Actions (see the npm security groups above).
      actions-security-patch-minor:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      actions-security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
